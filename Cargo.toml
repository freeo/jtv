[package]
name = "jtv"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Interactive Justfile runner powered by Television"

[features]
default = []
test-support = []

[[bin]]
name = "jtv-test-tool"
path = "tests/helpers/jtv_test_tool.rs"
required-features = ["test-support"]
test = false
bench = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
console = "=0.15.11"
ctrlc = { version = "3.4", features = ["termination"] }
dialoguer = "0.11"
directories = "6"
getrandom = "0.4"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.8"
walkdir = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
insta = { version = "=1.48.0", default-features = false }
portable-pty = { version = "=0.9.0", default-features = false }
predicates = "3"
pretty_assertions = "1"
vt100 = { version = "=0.16.2", default-features = false }

[profile.release]
lto = "thin"
strip = true
