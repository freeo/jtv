[package]
name = "jtv"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Interactive Justfile runner powered by Television"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.4", features = ["termination"] }
dialoguer = "0.11"
directories = "6"
getrandom = "0.4"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.8"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
pretty_assertions = "1"

[profile.release]
lto = "thin"
strip = true
