name: ci

on:
  push:
  pull_request:

jobs:
  native:
    name: native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: cargo install just --version 1.53.0 --locked
      - run: just ci
      - name: Build universal macOS release binary
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin --bin jtv
          cargo build --release --locked --target x86_64-apple-darwin --bin jtv
          lipo -create \
            target/aarch64-apple-darwin/release/jtv \
            target/x86_64-apple-darwin/release/jtv \
            -output target/jtv-macos-universal-ci
          lipo -archs target/jtv-macos-universal-ci | grep -qw arm64
          lipo -archs target/jtv-macos-universal-ci | grep -qw x86_64
      - name: Upload sanitized test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jtv-test-artifacts-${{ matrix.os }}
          path: target/jtv-test-artifacts
          if-no-files-found: ignore
          retention-days: 7

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check --locked --all-targets --all-features
      - name: Upload sanitized test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jtv-test-artifacts-msrv
          path: target/jtv-test-artifacts
          if-no-files-found: ignore
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - run: cargo install cargo-audit --locked
      - run: cargo audit
