name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl --bin jtv
      - name: Prepare release assets
        run: |
          install -m 0755 target/x86_64-unknown-linux-musl/release/jtv jtv-linux-amd64
          file jtv-linux-amd64 | grep -q 'static'
          sha256sum jtv-linux-amd64 > jtv-linux-amd64.sha256
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" jtv-linux-amd64 jtv-linux-amd64.sha256 --verify-tag --generate-notes
