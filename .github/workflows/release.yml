name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl --bin jtv
      - name: Prepare release assets
        run: |
          mkdir release-assets
          install -m 0755 target/x86_64-unknown-linux-musl/release/jtv release-assets/jtv-linux-amd64
          install -m 0755 install.sh release-assets/jtv-install.sh
          file release-assets/jtv-linux-amd64 | grep -q 'static'
          (cd release-assets && sha256sum jtv-linux-amd64 > jtv-linux-amd64.sha256)
      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux
          path: release-assets

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Build macOS binary
        run: |
          cargo build --release --locked --bin jtv
          mkdir release-assets
          asset="jtv-macos-$(uname -m)"
          install -m 0755 target/release/jtv "release-assets/$asset"
          (cd release-assets && shasum -a 256 "$asset" > "$asset.sha256")
      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-macos
          path: release-assets

  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes
